name: splitify
description: "A desified, AI-enhanced, and UPI-integrated Splitwise alternative."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^8.0.0
  url_launcher: ^6.3.2
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  intl: ^0.18.0
  shared_upi_payment:
    git:
      url: https://github.com/praveenmv93/shared_upi_payment.git
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_launcher_icons: ^0.14.4
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/logo_transparent.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E1E1E"
  adaptive_icon_foreground: "assets/icon.png"

